name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App(s) to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - customer
          - driver

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.app == 'both' && '["customer","driver"]' || format('["{0}"]', inputs.app)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Restore native config (.env + Firebase plist)
        env:
          CUSTOMER_PLIST_B64: ${{ secrets.CUSTOMER_GOOGLE_SERVICE_INFO_B64 }}
          DRIVER_PLIST_B64: ${{ secrets.DRIVER_GOOGLE_SERVICE_INFO_B64 }}
          CUSTOMER_ENV_B64: ${{ secrets.CUSTOMER_ENV_B64 }}
          DRIVER_ENV_B64: ${{ secrets.DRIVER_ENV_B64 }}
        run: |
          set -e
          APP="${{ matrix.app }}"
          if [ "$APP" = "customer" ]; then PLIST="$CUSTOMER_PLIST_B64"; ENVFILE="$CUSTOMER_ENV_B64"; else PLIST="$DRIVER_PLIST_B64"; ENVFILE="$DRIVER_ENV_B64"; fi
          if [ -n "$PLIST" ]; then printf '%s' "$PLIST" | base64 -d > "apps/$APP/GoogleService-Info.plist"; fi
          if [ -n "$ENVFILE" ]; then printf '%s' "$ENVFILE" | base64 -d > "apps/$APP/.env"; fi

      - name: Expo prebuild (iOS)
        env:
          EXPO_NO_TELEMETRY: "1"
          RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.RNMAPBOX_MAPS_DOWNLOAD_TOKEN }}
        run: |
          cd "apps/${{ matrix.app }}"
          npx expo prebuild --platform ios --clean --no-install

      - name: CocoaPods install
        env:
          RNMAPBOX_MAPS_DOWNLOAD_TOKEN: ${{ secrets.RNMAPBOX_MAPS_DOWNLOAD_TOKEN }}
        run: |
          cd "apps/${{ matrix.app }}/ios"
          pod install

      - name: Build unsigned device app
        run: |
          set -e
          cd "apps/${{ matrix.app }}/ios"
          WORKSPACE="$(ls -d *.xcworkspace | head -1)"
          SCHEME="$(xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import sys,json;print(json.load(sys.stdin)["workspace"]["schemes"][0])')"
          echo "::notice::Workspace=$WORKSPACE Scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          APP_PATH="$(find build/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)"
          echo "::notice::APP_PATH=$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "${SCHEME}.ipa" Payload
          ls -la "${SCHEME}.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-ios-ipa
          path: apps/${{ matrix.app }}/ios/*.ipa
          if-no-files-found: error
          retention-days: 14
